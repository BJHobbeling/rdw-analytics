version: 2

models:
  - name: int_brandstof_geaggregeerd
    description: "Geaggregeerde brandstoftabel op kentekenniveau (1 rij per voertuig)."
    columns:
      - name: kenteken
        description: "Unieke primaire sleutel na brandstofaggregatie."
        tests:
          - unique
          - not_null

  - name: int_voertuigen_met_ex_lease
    description: "Verrijkte voertuiggegevens met gewichtsklasse en een indicatie voor ex-lease."
    columns:
      - name: kenteken
        description: "Unieke identifier van het voertuig."
        tests:
          - unique
          - not_null